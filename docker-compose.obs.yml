# Observability overlay for the Rustok stack: Grafana Alloy (OTLP ingest + log
# shipping) -> Tempo (traces) / Prometheus (metrics) / Loki (logs), surfaced in
# Grafana. Optional; always layered on the base file (needs the `edge` network).
#
# Usage (on top of base, or base+prod):
#   GF_SECURITY_ADMIN_PASSWORD=... \
#     docker compose -f docker-compose.yml -f docker-compose.obs.yml up -d
#   # production:
#   ... -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.obs.yml up -d
#
# Nothing here is published to the public internet: only Grafana binds a host
# port, on loopback (127.0.0.1:3030). Reach it via SSH tunnel. Backends sit on
# the internal `observability` network; Alloy also joins `edge` to receive OTLP
# from apps.

services:
  alloy:
    image: grafana/alloy:v1.8.1@sha256:7790f6f7fbd8e4486b4b6c6fc6a7293a73605bb79aaa7f49003cb366943724f6
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # Docker socket for log discovery. `:ro` does NOT restrict the Docker API
      # (a compromised Alloy is root-equivalent on the host); compensating
      # controls are network isolation, no published port, resource limits,
      # no-new-privileges. Follow-up: docker-socket-proxy. See spec D2.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability
      - edge # receive OTLP from apps (gateway/mcp) in 5.2b/c
      - telemetry # dedicated app->Alloy OTLP egress (PR-5.2b)
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    restart: unless-stopped
    healthcheck:
      # The alloy image ships neither wget nor curl, but has bash — probe the
      # readiness endpoint over /dev/tcp (same pattern as the gateway in base).
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/12345 &&
          printf 'GET /-/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tempo:
    image: grafana/tempo:2.7.0@sha256:12e904cc509a8e0bd87815e0bc719b6167933bc3f2532716a85811af967780f6
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - observability
    user: "0:0" # tempo writes to /var/tempo; volume owned by root
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.4.1@sha256:9abc6cf6aea7710d163dbb28d8eeb7dc5baef01e38fa4cd146a406dd9f07f70d
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-remote-write-receiver # accept Alloy's pushed metrics
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:3.5.0@sha256:4c431d2e6b9b38718694b31c5d56be7c80dc69c513215fde1aeb5b02cd4e2665
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      - observability
    user: "0:0" # loki writes to /loki; volume owned by root
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.6.0@sha256:62d2b9d20a19714ebfe48d1bb405086081bc602aa053e28cf6d73c7537640dfb
    ports:
      - "127.0.0.1:3030:3000" # loopback only — reach via SSH tunnel
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set the Grafana admin password (openssl rand -hex 16)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy

  # --- application OTLP wiring (PR-5.2b) ---
  # core/gateway are fully defined in the base file; these overrides only add the
  # telemetry network + OTLP endpoint, so distributed tracing is enabled exactly
  # when the observability overlay is layered on (and stays off for a plain
  # `docker compose up`). The `networks` lists are re-declared IN FULL because
  # Compose does not reliably append a service's `networks` sequence across `-f`
  # overlays — a partial list would drop base connectivity.
  core:
    networks:
      - internal # keep base connectivity (gateway -> core)
      - telemetry # reach alloy:4318 for OTLP export
    environment:
      RUSTOK_OTLP_ENDPOINT: http://alloy:4318

  gateway:
    networks:
      - internal # base: reach core
      - edge # base: reachable by mcp / caddy
      - telemetry # reach alloy:4318 for OTLP export
    environment:
      RUSTOK_OTLP_ENDPOINT: http://alloy:4318

networks:
  observability:
  # Dedicated, narrow network for app -> Alloy OTLP egress. Core stays off `edge`
  # (where mcp/caddy live) so its unauthenticated gRPC port is not exposed there.
  telemetry:

volumes:
  alloy-data:
  tempo-data:
  prometheus-data:
  loki-data:
  grafana-data:
