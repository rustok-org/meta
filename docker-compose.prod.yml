# Production overlay for the Rustok stack: adds Caddy (TLS termination) and
# makes the MCP inbound auth key required.
#
# Usage:
#   RUSTOK_KEYRING_PASSWORD=... RUSTOK_PUBLIC_DOMAIN=... RUSTOK_ACME_EMAIL=... \
#   RUSTOK_MCP_INBOUND_API_KEY=$(openssl rand -hex 32) \
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Caddy is the only service binding non-loopback ports (80/443). It terminates
# TLS for the public MCP endpoint and proxies to mcp:3001 over the edge network.
# Gateway/MCP keep their loopback (127.0.0.1) publishing from the base file —
# unreachable from outside the host.

services:
  mcp:
    # environment-only override (do NOT add ports here: Compose appends port
    # lists across files, which would duplicate the host binding). The inbound
    # bearer key is required in prod so the stack refuses to start without it.
    environment:
      RUSTOK_MCP_INBOUND_API_KEY: ${RUSTOK_MCP_INBOUND_API_KEY:?set inbound key (openssl rand -hex 32) before public exposure}

  caddy:
    # Pinned tag + digest (review F1): reproducible deploys, bumped via Dependabot.
    image: caddy:2.11.4-alpine@sha256:77c07d5ebfa5be9fd6c820d2094ae662c9e7eeb9bf98346b7f639900263ee2a2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      # :? makes prod up fail fast when the TLS inputs are missing.
      RUSTOK_PUBLIC_DOMAIN: ${RUSTOK_PUBLIC_DOMAIN:?set the public domain for TLS}
      RUSTOK_ACME_EMAIL: ${RUSTOK_ACME_EMAIL:?set the ACME account email}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # ACME account + issued certs; losing it re-issues against LE rate limits
      - caddy-config:/config
    networks:
      - edge
    healthcheck:
      # Admin API is local-only (default 127.0.0.1:2019); busybox wget ships in alpine.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    # Hardening. Deviation from the stack baseline: no `user:` override — the
    # entrypoint must start as root to bind 80/443 (the binary carries no file
    # capabilities for a non-root bind). Compensated by dropping every other
    # capability. read_only is safe: the official image points XDG_CONFIG_HOME
    # at /config and XDG_DATA_HOME at /data, both rw volumes.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    restart: unless-stopped
    depends_on:
      mcp:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
