# Production overlay for the Rustok stack: adds Caddy (TLS termination) and
# tightens the prod trust boundaries.
#
# Usage:
#   RUSTOK_KEYRING_PASSWORD=... RUSTOK_PUBLIC_DOMAIN=... RUSTOK_ACME_EMAIL=... \
#   RUSTOK_MCP_API_KEY=... RUSTOK_MCP_INBOUND_API_KEY=$(openssl rand -hex 32) \
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Caddy is the only service binding non-loopback ports (80/443). It terminates
# TLS for the public MCP endpoint and reaches mcp over a dedicated caddy-link
# network — it is NOT on `edge`, so a compromised proxy cannot reach gateway.
# Gateway/MCP keep their loopback (127.0.0.1) publishing from the base file.

services:
  gateway:
    # Require the inter-service key in prod (review #3): without it the
    # MCP->Gateway trust boundary collapses to "anyone who reaches gateway".
    environment:
      RUSTOK_MCP_API_KEY: ${RUSTOK_MCP_API_KEY:?set the MCP<->Gateway key in prod}

  mcp:
    # environment-only override (no `ports`: Compose appends port lists across
    # files, which would duplicate the host binding).
    environment:
      # Inbound bearer key clients must present — required so prod refuses to
      # start without it (D2). Must be non-whitespace (mcp normalizes blank->none).
      RUSTOK_MCP_INBOUND_API_KEY: ${RUSTOK_MCP_INBOUND_API_KEY:?set inbound key (openssl rand -hex 32) before public exposure}
      RUSTOK_MCP_API_KEY: ${RUSTOK_MCP_API_KEY:?set the MCP<->Gateway key in prod}
    networks:
      # edge (from base) keeps mcp<->gateway; caddy-link adds the proxy hop.
      - edge
      - caddy-link

  caddy:
    # Pinned tag + digest (review F1): reproducible deploys, bumped via Dependabot.
    image: caddy:2.11.4-alpine@sha256:77c07d5ebfa5be9fd6c820d2094ae662c9e7eeb9bf98346b7f639900263ee2a2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      # :? makes prod up fail fast when the TLS inputs are missing.
      RUSTOK_PUBLIC_DOMAIN: ${RUSTOK_PUBLIC_DOMAIN:?set the public domain for TLS}
      RUSTOK_ACME_EMAIL: ${RUSTOK_ACME_EMAIL:?set the ACME account email}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # ACME account + issued certs; losing it re-issues against LE rate limits
      - caddy-config:/config
    networks:
      # Only the dedicated link to mcp — NOT edge (review #2).
      - caddy-link
    healthcheck:
      # Probe the real public endpoint end-to-end (admin API is off, review #4).
      # curl (present in the image) with --resolve sets SNI to the site domain
      # while dialing the loopback; -k tolerates the internal/staging CA; -f
      # makes a non-2xx fail the check.
      test: ["CMD-SHELL", "curl -fsS -k --resolve ${RUSTOK_PUBLIC_DOMAIN}:443:127.0.0.1 https://${RUSTOK_PUBLIC_DOMAIN}/health"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    # Hardening. Deviation from the stack baseline: no `user:` override — the
    # entrypoint must start as root to bind 80/443 (the binary carries no file
    # capabilities for a non-root bind). Compensated by dropping every other
    # capability. read_only is safe: the official image points XDG_CONFIG_HOME
    # at /config and XDG_DATA_HOME at /data, both rw volumes.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    restart: unless-stopped
    # Resource caps + log rotation for the public proxy (review #6).
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      mcp:
        condition: service_healthy

networks:
  caddy-link:

volumes:
  caddy-data:
  caddy-config:
