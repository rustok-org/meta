# Full Rustok stack: MCP (SSE) -> Gateway (REST) -> Core (gRPC) + Redis.
#
# Usage:
#   RUSTOK_KEYRING_PASSWORD=... docker compose up -d
#
# Only Gateway (:3000) and MCP (:3001) are published, loopback-only.
# Core and Redis publish no ports, so they are unreachable from the host;
# the internal network is NOT `internal: true` because Core needs egress
# to blockchain RPC providers (Alchemy / public RPCs).

services:
  core:
    build:
      context: ../core
      dockerfile: Dockerfile
    image: rustok-core:v0.1.0
    environment:
      RUSTOK_GRPC_ADDR: "0.0.0.0:50051"
      RUSTOK_REDIS_URL: "redis://redis:6379"
      RUSTOK_KEYRING_PASSWORD: ${RUSTOK_KEYRING_PASSWORD}
      RUSTOK_ALLOWED_CHAINS: ${RUSTOK_ALLOWED_CHAINS:-1,8453}
      RUSTOK_ALCHEMY_API_KEY: ${RUSTOK_ALCHEMY_API_KEY:-}
    volumes:
      - rustok-data:/home/rustok/.rustok/agent
    networks:
      - internal
    # Hardening
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started

  gateway:
    image: rustok-core:v0.1.0
    entrypoint: ["/usr/local/bin/gateway"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      RUSTOK_GATEWAY_ADDR: "0.0.0.0:3000"
      RUSTOK_CORE_ADDR: "http://core:50051"
      RUSTOK_MCP_API_KEY: ${RUSTOK_MCP_API_KEY:-}
    networks:
      - internal
      - edge
    healthcheck:
      # Hit /health over /dev/tcp (no curl in the image) and require a
      # serving Core downstream, not just a bound port.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/3000 &&
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"core":"serving"' <&3
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    # Hardening
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy

  mcp:
    build:
      context: ../mcp
      dockerfile: Dockerfile
    image: rustok-mcp:v0.1.0
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      RUSTOK_MCP_HOST: "0.0.0.0"
      RUSTOK_MCP_PORT: "3001"
      RUSTOK_MCP_GATEWAY_URL: "http://gateway:3000"
      RUSTOK_MCP_API_KEY: ${RUSTOK_MCP_API_KEY:-}
    networks:
      - edge
    healthcheck:
      # Override the image default to follow the configured port.
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          urllib.request.urlopen(f"http://127.0.0.1:{os.environ.get('RUSTOK_MCP_PORT', '3001')}/health", timeout=2)
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    # Hardening
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    networks:
      - internal
    # Hardening
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    user: "999:999"
    restart: unless-stopped

volumes:
  rustok-data:

networks:
  internal:
  edge:
