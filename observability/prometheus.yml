# Prometheus scrape config. Retention is set via flags in docker-compose.obs.yml
# (--storage.tsdb.retention.{time,size}). Remote-write receiver is enabled via
# flag so Alloy can push OTLP-derived metrics here.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"] # Alloy's own /metrics

  # App metrics (gateway / core / mcp) are NOT scraped — they are pushed via OTLP
  # to Alloy and arrive here through the remote-write receiver (PR-5.2d). No app
  # scrape targets needed.
